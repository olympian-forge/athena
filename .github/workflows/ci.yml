name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-test-perft:
    name: Build, unit tests, and perft correctness
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so the C++20/GCC 13+ floor is deterministic
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pciutils libgtest-dev lcov

      - name: Build and install GoogleTest static libraries
        run: |
          cd /usr/src/googletest
          sudo cmake .
          sudo make
          sudo find . -name "*.a" -exec cp {} /usr/lib/ \;

      - name: Build, run unit tests, and enforce 100% coverage
        run: ./scripts/test.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage/report

      - name: Rebuild perft in Release mode
        run: |
          rm -rf build
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target perft -j

      - name: Run perft correctness suite
        run: |
          python3 tools/perft.py
          cat PERFT_RESULTS.md
          if grep -q "FAIL" PERFT_RESULTS.md; then
            echo "::error::Perft mismatch detected -- move generation is no longer mathematically correct. See PERFT_RESULTS.md above."
            exit 1
          fi

      - name: Upload perft results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perft-results
          path: PERFT_RESULTS.md
